<!doctype html>
<html lang="en" data-solo>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Services card ideas — Noah Zaw Min Htut</title>
  <script>try{var t=localStorage.getItem('sample-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="../shared.css">
  <style>
    /* Services card options: each card acts out its service on hover (on touch, when centred). */
    body { font-family: 'Archivo', system-ui, sans-serif; line-height: 1.5; }
    .mono { font-family: 'Geist Mono', monospace; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .page { max-width: 1440px; margin: 0 auto; padding: clamp(2.5rem, 6vh, 4.5rem) var(--gutter) 7rem; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 2rem; flex-wrap: wrap; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
    .intro h1 { margin: 0; font-weight: 800; font-size: clamp(2.6rem, 6vw, 6rem); line-height: .85; text-transform: uppercase; font-stretch: 62%; }
    .intro p { margin: 0; max-width: 30rem; color: var(--muted); }
    .svc { padding-top: clamp(3rem, 8vh, 5rem); }
    .svc__head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 1.2rem; }
    .svc__head h2 { margin: 0; font-weight: 800; font-size: clamp(1.8rem, 3.4vw, 3.2rem); text-transform: uppercase; font-stretch: 70%; line-height: .9; }
    .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .opt__label { display: flex; justify-content: space-between; margin-bottom: .6rem; }
    .pick { color: var(--pink); }

    /* The card itself: the same shell as the fusion page's services cards. */
    .card { position: relative; display: flex; flex-direction: column; gap: 1.2rem; padding: 1.1rem; border-radius: 1rem; background: var(--bg-2); color: var(--ink); transition: background-color .5s var(--ease), color .5s var(--ease); cursor: default; }
    .card.is-on { background: var(--ink); color: var(--bg); }
    .card__n { color: var(--pink); }
    .card h3 { margin: 0 0 .5rem; font-weight: 800; font-size: clamp(1.5rem, 2.1vw, 2.1rem); line-height: .9; text-transform: uppercase; font-stretch: 70%; }
    .card p { margin: 0; font-size: .95rem; line-height: 1.4; opacity: .8; }
    .hint { position: absolute; right: 1.1rem; top: 1.1rem; opacity: .55; }

    /* Stage: a little browser window the scene plays in. Sizes scale with its width (cqw). */
    .stage { position: relative; aspect-ratio: 16 / 11; border-radius: .7rem; overflow: hidden; background: #FBEBDD; color: #1B1411; container-type: inline-size; box-shadow: inset 0 0 0 1px rgba(27,20,17,.1); }
    :root[data-theme='dark'] .stage { background: #18282A; color: #F8DBC1; box-shadow: inset 0 0 0 1px rgba(248,219,193,.12); }
    .stage__bar { position: absolute; z-index: 9; inset: 0 0 auto; height: 7cqw; display: flex; align-items: center; gap: 1.2cqw; padding: 0 2.6cqw; background: rgba(27,20,17,.06); }
    :root[data-theme='dark'] .stage__bar { background: rgba(248,219,193,.06); }
    .stage__bar i { width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: currentColor; opacity: .25; }
    .view { position: absolute; inset: 7cqw 0 0; overflow: hidden; }

    /* A mini homepage, positioned the same way in every style so pieces can swap one for one. */
    .mp { position: absolute; inset: 0; font-size: 2.4cqw; }
    .mp > * { position: absolute; display: flex; align-items: center; }
    .p-logo { left: 6%; top: 7%; width: 18%; height: 9%; }
    .p-nav { right: 6%; top: 7%; width: 44%; height: 9%; justify-content: flex-end; gap: 3cqw; }
    .p-h { left: 6%; top: 25%; width: 50%; height: 30%; align-items: flex-start; }
    .p-txt { left: 6%; top: 57%; width: 46%; height: 12%; align-items: flex-start; }
    .p-btn { left: 6%; top: 73%; width: 30%; height: 13%; justify-content: center; }
    .p-img { right: 6%; top: 25%; width: 34%; height: 61%; overflow: hidden; }
    .p-img img { width: 100%; height: 100%; object-fit: cover; }
    .mp-bg { position: absolute; inset: 0; }

    /* wire: grey placeholders */
    .v-wire .ph { background: rgba(127,127,127,.22); border-radius: 1cqw; }
    .v-wire .p-nav span { width: 8cqw; height: 1.8cqw; }
    .v-wire .p-h { flex-direction: column; gap: 2cqw; } .v-wire .p-h span { width: 100%; height: 5cqw; } .v-wire .p-h span:last-child { width: 70%; }
    .v-wire .p-txt { flex-direction: column; gap: 1.4cqw; } .v-wire .p-txt span { width: 100%; height: 1.6cqw; } .v-wire .p-txt span:last-child { width: 60%; }
    .v-wire .p-img { background: rgba(127,127,127,.22); border-radius: 1cqw; } .v-wire .p-img::before, .v-wire .p-img::after { content: ''; position: absolute; left: 50%; top: 50%; width: 140%; height: 1px; background: rgba(127,127,127,.5); rotate: 58deg; translate: -50% 0; } .v-wire .p-img::after { rotate: -58deg; }
    .v-wire .p-logo { background: rgba(127,127,127,.22); border-radius: 1cqw; } .v-wire .p-btn { background: rgba(127,127,127,.22); border-radius: 99px; }

    /* fin: the finished, current look */
    .v-fin .mp-bg { background: #F8DBC1; } :root[data-theme='dark'] .v-fin .mp-bg { background: #0E1718; }
    .v-fin { color: #1B1411; } :root[data-theme='dark'] .v-fin { color: #F8DBC1; }
    .v-fin .p-logo { font-weight: 800; font-size: 3.6cqw; letter-spacing: -.04em; } .v-fin .p-logo i { display: inline-block; width: .17em; height: .17em; margin-left: .06em; background: #EA4F6E; align-self: flex-end; margin-bottom: .3em; }
    .v-fin .p-nav { font: 1.7cqw 'Geist Mono'; text-transform: uppercase; letter-spacing: .06em; }
    .v-fin .p-h { font-weight: 800; font-size: 6.4cqw; line-height: .88; text-transform: uppercase; font-stretch: 75%; }
    .v-fin .p-txt { font-size: 1.9cqw; line-height: 1.35; opacity: .7; }
    .v-fin .p-btn { background: #EA4F6E; color: #1B1411; border-radius: 99px; font-weight: 600; font-size: 2cqw; }
    .v-fin .p-img { border-radius: 1.6cqw; }

    /* old: a dated homepage */
    .v-old .mp-bg { background: #C8C8C8; }
    .v-old { color: #000; font-family: 'Times New Roman', Times, serif; }
    .v-old .p-logo { font-size: 3.4cqw; font-weight: 700; font-style: italic; color: #800000; }
    .v-old .p-nav { font-size: 2cqw; color: #0000EE; text-decoration: underline; gap: 1.2cqw; }
    .v-old .p-h { font-size: 4.6cqw; line-height: 1.05; justify-content: center; text-align: center; color: #000080; }
    .v-old .p-txt { font-size: 2cqw; justify-content: center; text-align: center; font-style: italic; }
    .v-old .p-btn { background: #DDD; border: .5cqw outset #EEE; font-size: 2.2cqw; font-family: Arial, sans-serif; }
    .v-old .p-img { border: .7cqw ridge #888; } .v-old .p-img img { filter: saturate(.25) contrast(.8) blur(.3px); image-rendering: pixelated; }

    /* brut: loud mono */
    .v-brut .mp-bg { background: #fff; } .v-brut { color: #000; font-family: 'Geist Mono', monospace; }
    .v-brut .p-logo { font-size: 3cqw; font-weight: 700; border: .4cqw solid #000; justify-content: center; }
    .v-brut .p-nav { font-size: 1.8cqw; text-transform: uppercase; }
    .v-brut .p-h { font-size: 5.6cqw; line-height: .95; text-transform: uppercase; }
    .v-brut .p-txt { font-size: 1.8cqw; }
    .v-brut .p-btn { background: #000; color: #fff; font-size: 2cqw; text-transform: uppercase; }
    .v-brut .p-img { border: .4cqw solid #000; } .v-brut .p-img img { filter: grayscale(1) contrast(1.6); }

    /* soft: rounded pastel */
    .v-soft .mp-bg { background: #DDEBE8; } .v-soft { color: #1D646C; }
    .v-soft .p-logo { font-size: 3.2cqw; font-weight: 600; font-style: italic; }
    .v-soft .p-nav { font-size: 1.9cqw; }
    .v-soft .p-h { font-size: 5cqw; line-height: 1; font-weight: 300; letter-spacing: -.03em; }
    .v-soft .p-txt { font-size: 1.9cqw; opacity: .8; }
    .v-soft .p-btn { background: #fff; border-radius: 99px; font-size: 2cqw; box-shadow: 0 1cqw 2cqw rgba(29,100,108,.2); }
    .v-soft .p-img { border-radius: 50% 50% 2cqw 2cqw; } .v-soft .p-img img { filter: saturate(.7) brightness(1.08); }

    .layer { position: absolute; inset: 0; }

    /* 1B: typing */
    .type { position: absolute; inset: 0; display: grid; place-items: center; }
    .type code { font: 3.4cqw 'Geist Mono', monospace; color: #1D646C; } :root[data-theme='dark'] .type code { color: #5FB3BA; }
    .type .caret { display: inline-block; width: .55em; height: 1.05em; vertical-align: -.18em; background: #EA4F6E; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .type__out { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15cqw; text-transform: uppercase; letter-spacing: -.02em; opacity: 0; }
    .type__out i { display: inline-block; width: .2em; height: .2em; background: #EA4F6E; margin: .5em 0 0 .05em; }

    /* 1C: sketch */
    .sketch { position: absolute; inset: 0; width: 100%; height: 100%; }
    .sketch path { fill: none; stroke: currentColor; stroke-width: .9; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }

    /* 2B: slider */
    .split { position: absolute; inset: 0; --x: 85%; cursor: ew-resize; }
    .split .layer.new { clip-path: inset(0 0 0 var(--x)); }
    .split__line { position: absolute; z-index: 5; top: 0; bottom: 0; left: var(--x); width: 2px; translate: -1px 0; background: #EA4F6E; }
    .split__line::after { content: '⟷'; position: absolute; top: 50%; left: 50%; translate: -50% -50%; display: grid; place-items: center; width: 6cqw; height: 6cqw; border-radius: 50%; background: #EA4F6E; color: #1B1411; font-size: 3cqw; }
    .split__tag { position: absolute; z-index: 6; bottom: 3cqw; padding: .6cqw 1.4cqw; border-radius: 99px; background: rgba(14,23,24,.75); color: #F8DBC1; font: 1.6cqw 'Geist Mono'; text-transform: uppercase; }
    .split__tag--a { left: 3cqw; } .split__tag--b { right: 3cqw; }

    /* 3A / 3B: code panes */
    .code { position: absolute; left: 5%; top: 8%; width: 52%; margin: 0; padding: 3cqw; border-radius: 1.6cqw; background: #0E1718; color: #F8DBC1; font: 2.1cqw/1.75 'Geist Mono', monospace; white-space: pre; overflow: hidden; }
    .code .ln { display: block; padding: 0 1cqw; margin: 0 -1cqw; border-radius: .6cqw; transition: background-color .3s, color .3s; }
    .code .ln.is-run { background: rgba(234,79,110,.25); }
    .code .k { color: #5FB3BA; } .code .s { color: #EA4F6E; } .code .v { color: #F2C27B; }
    .comp { position: absolute; right: 7%; top: 22%; width: 28%; aspect-ratio: 3 / 4; border-radius: 2cqw; background: #fff; box-shadow: 0 2cqw 4cqw -2cqw rgba(0,0,0,.35); overflow: hidden; display: flex; flex-direction: column; }
    .comp img { width: 100%; height: 62%; object-fit: cover; }
    .comp b { display: block; margin: 1.6cqw 1.6cqw .6cqw; height: 1.8cqw; width: 70%; background: #1B1411; border-radius: .6cqw; opacity: .8; }
    .comp b + b { margin-top: 0; width: 45%; opacity: .3; }
    .comp-sel { position: absolute; inset: -1.2cqw; border: .3cqw dashed #1D646C; border-radius: 3cqw; opacity: 0; }
    .knobs { position: absolute; left: 5%; bottom: 7%; font: 1.6cqw 'Geist Mono'; opacity: .7; text-transform: uppercase; }

    /* 3C: dev-tools outlines */
    .ol { position: absolute; z-index: 6; border: .3cqw solid #1D646C; background: rgba(29,100,108,.12); opacity: 0; }
    :root[data-theme='dark'] .ol { border-color: #5FB3BA; background: rgba(95,179,186,.14); }
    .ol span { position: absolute; left: -.3cqw; top: -3.2cqw; padding: .3cqw 1cqw; background: #1D646C; color: #F8DBC1; font: 1.5cqw 'Geist Mono'; white-space: nowrap; border-radius: .4cqw; }
    :root[data-theme='dark'] .ol span { background: #5FB3BA; color: #0E1718; }

    /* 4A: dial */
    .dial { position: absolute; left: 6%; top: 10%; width: 40%; aspect-ratio: 1; }
    .dial svg { width: 100%; height: 100%; rotate: -90deg; }
    .dial circle { fill: none; stroke-width: 7; }
    .dial .track { stroke: rgba(127,127,127,.2); }
    .dial .arc { stroke: #E58A3A; stroke-linecap: round; }
    .dial b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 10cqw; font-stretch: 80%; }
    .dial small { position: absolute; left: 0; right: 0; bottom: -7cqw; text-align: center; font: 1.6cqw 'Geist Mono'; text-transform: uppercase; opacity: .6; }
    .log { position: absolute; right: 5%; top: 12%; width: 44%; list-style: none; margin: 0; padding: 0; font: 2cqw/1.4 'Geist Mono', monospace; }
    .log li { display: flex; gap: 1.4cqw; padding: 1.4cqw 0; border-bottom: 1px solid rgba(127,127,127,.25); opacity: .18; }
    .log li i { font-style: normal; color: #1D646C; } :root[data-theme='dark'] .log li i { color: #5FB3BA; }
    .eg { position: absolute; right: 5%; bottom: 5%; font: 1.5cqw 'Geist Mono'; text-transform: uppercase; opacity: .55; }

    /* 4B: versions */
    .ver { position: absolute; width: 74%; height: 74%; container-type: inline-size; border-radius: 1.6cqw; overflow: hidden; box-shadow: 0 2cqw 5cqw -2cqw rgba(0,0,0,.4); }
    .ver__tag { position: absolute; z-index: 5; right: 2cqw; top: 2cqw; padding: .5cqw 1.2cqw; border-radius: 99px; background: #1B1411; color: #F8DBC1; font: 1.6cqw 'Geist Mono'; }

    /* 4C: bugs */
    .tick { position: absolute; z-index: 6; display: grid; place-items: center; width: 4.4cqw; height: 4.4cqw; border-radius: 50%; background: #1D646C; color: #F8DBC1; font-size: 2.4cqw; scale: 0; }
    .broken { position: absolute; inset: 0; display: grid; place-items: center; background: #eee; color: #888; font: 1.6cqw 'Geist Mono'; border: .3cqw dashed #bbb; }

    @media (max-width: 1000px) { .row { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } .hint { display: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Services<br>card ideas</h1>
      <p>Twelve options, three per service. Hover a card to see it act out its service; on a phone it plays when the card reaches the middle of the screen. Option 1 is my pick for each.</p>
    </header>
    <div id="rows"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script src="../shared.js" defer></script>
  <script defer>
  addEventListener('DOMContentLoaded', () => {
    const IMG = '../../assets/images/';
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

    /* One mini homepage in a given style. Every style uses the same slots. */
    const page = (v) => {
      const c = {
        wire: { logo: '', nav: '<span class="ph"></span><span class="ph"></span><span class="ph"></span>', h: '<span class="ph"></span><span class="ph"></span>', txt: '<span class="ph"></span><span class="ph"></span>', btn: '', img: '' },
        fin: { logo: 'Mori<i></i>', nav: '<span>Menu</span><span>Story</span><span>Book</span>', h: 'Fresh, every morning', txt: 'A small bakery-café. Bread out of the oven at seven.', btn: 'Book a table', img: `<img src="${IMG}concept-crumb-and-kin-poster.webp" alt="">` },
        old: { logo: "Mori's", nav: '<span>Home</span>|<span>About</span>|<span>Contact</span>', h: 'Welcome to our Homepage!!', txt: 'Best viewed in 800×600', btn: 'Click Here', img: `<img src="${IMG}concept-crumb-and-kin-poster.webp" alt="">` },
        brut: { logo: 'MORI', nav: '<span>Menu</span><span>Story</span><span>Book</span>', h: 'Fresh every morning', txt: 'Bread at 07:00.', btn: 'Book →', img: `<img src="${IMG}concept-crumb-and-kin-poster.webp" alt="">` },
        soft: { logo: 'mori', nav: '<span>menu</span><span>story</span><span>book</span>', h: 'Fresh, every morning', txt: 'A small bakery-café.', btn: 'Book a table', img: `<img src="${IMG}concept-crumb-and-kin-poster.webp" alt="">` },
      }[v];
      const ph = v === 'wire' ? ' ph' : '';
      return `<div class="mp v-${v}"><div class="mp-bg"></div><div class="p-logo${ph}" data-k="logo">${c.logo}</div><div class="p-nav" data-k="nav">${c.nav}</div><div class="p-h" data-k="h">${c.h}</div><div class="p-txt" data-k="txt">${c.txt}</div><div class="p-btn${ph}" data-k="btn">${c.btn}</div><div class="p-img" data-k="img">${c.img}</div></div>`;
    };
    const stage = (inner) => `<div class="stage"><div class="stage__bar"><i></i><i></i><i></i></div><div class="view">${inner}</div></div>`;
    const KEYS = ['logo', 'nav', 'h', 'txt', 'btn', 'img'];
    const wipeIn = (el) => ({ clipPath: 'inset(0% 100% 0% 0%)' });

    /* ---------- Scenes: markup + a timeline (paused; played on hover, reversed on leave) ---------- */
    const SCENES = {
      // New website
      wire: {
        html: () => stage(`<div class="layer a">${page('wire')}</div><div class="layer b">${page('fin')}</div>`),
        tl: (el) => {
          const tl = gsap.timeline({ paused: true });
          tl.set($('.b .mp-bg', el), { opacity: 0 }, 0);
          KEYS.forEach((k) => tl.set($(`.b [data-k="${k}"]`, el), { clipPath: 'inset(0% 100% 0% 0%)' }, 0));
          tl.to($('.b .mp-bg', el), { opacity: 1, duration: .5 }, 0);
          KEYS.forEach((k, i) => {
            tl.to($(`.a [data-k="${k}"]`, el), { opacity: 0, duration: .3 }, .15 + i * .14)
              .to($(`.b [data-k="${k}"]`, el), { clipPath: 'inset(0% 0% 0% 0%)', duration: .55, ease: 'expo.out' }, .15 + i * .14);
          });
          return tl;
        },
      },
      type: {
        html: () => stage(`<div class="type"><code><span class="t"></span><span class="caret"></span></code></div><div class="type__out">Hello<i></i></div>`),
        tl: (el) => {
          const code = '<h1>Hello</h1>', t = $('.t', el), o = { n: 0 };
          return gsap.timeline({ paused: true })
            .to(o, { n: code.length, duration: 1.1, ease: `steps(${code.length})`, onUpdate: () => { t.textContent = code.slice(0, Math.round(o.n)); } })
            .to($('.type', el), { opacity: 0, scale: .9, duration: .35 }, '+=.25')
            .fromTo($('.type__out', el), { opacity: 0, yPercent: 30, scale: .8 }, { opacity: 1, yPercent: 0, scale: 1, duration: .7, ease: 'expo.out' }, '<.1');
        },
      },
      sketch: {
        html: () => stage(`<svg class="sketch" viewBox="0 0 160 103" preserveAspectRatio="none" aria-hidden="true">
            <path d="M10 6 L39 7 L38 16 L9 15 Z"/><path d="M90 11 L100 10 M107 11 L118 11 M125 10 L150 11"/>
            <path d="M10 26 Q50 24 88 27 M10 37 Q45 35 70 38"/><path d="M10 60 L80 59 M10 66 L55 66"/>
            <path d="M12 76 Q28 73 56 76 Q58 84 55 89 Q30 91 11 88 Q9 82 12 76"/>
            <path d="M104 26 L151 25 L152 89 L103 90 Z M104 26 L151 89 M151 25 L103 90"/></svg>
          <div class="layer b">${page('fin')}</div>`),
        tl: (el) => {
          const paths = $$('.sketch path', el);
          paths.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
          const tl = gsap.timeline({ paused: true });
          tl.set($('.b', el), { clipPath: 'inset(0% 100% 0% 0%)' }, 0)
            .fromTo(paths, { opacity: 0 }, { opacity: .75, duration: .01, immediateRender: false }, 0)
            .to(paths, { strokeDashoffset: 0, duration: .5, stagger: .12, ease: 'power1.inOut' }, 0)
            .to($('.b', el), { clipPath: 'inset(0% 0% 0% 0%)', duration: .9, ease: 'expo.inOut' }, '+=.15')
            .to($('.sketch', el), { opacity: 0, duration: .4 }, '<.4');
          return tl;
        },
      },
      // Redesign
      swap: {
        html: () => stage(`<div class="layer a">${page('old')}</div><div class="layer b">${page('fin')}</div>`),
        tl: (el) => {
          const tl = gsap.timeline({ paused: true });
          tl.set($('.b .mp-bg', el), { clipPath: 'inset(0% 0% 100% 0%)' }, 0);
          KEYS.forEach((k) => tl.set($(`.b [data-k="${k}"]`, el), { clipPath: 'inset(0% 100% 0% 0%)' }, 0));
          tl.to($('.b .mp-bg', el), { clipPath: 'inset(0% 0% 0% 0%)', duration: .7, ease: 'expo.inOut' }, 0);
          ['h', 'txt', 'nav', 'logo', 'img', 'btn'].forEach((k, i) => {
            tl.to($(`.a [data-k="${k}"]`, el), { opacity: 0, duration: .25 }, .45 + i * .16)
              .to($(`.b [data-k="${k}"]`, el), { clipPath: 'inset(0% 0% 0% 0%)', duration: .5, ease: 'expo.out' }, .45 + i * .16);
          });
          return tl;
        },
      },
      slider: {
        html: () => stage(`<div class="split"><div class="layer old">${page('old')}</div><div class="layer new">${page('fin')}</div><span class="split__line"></span><span class="split__tag split__tag--a">Before</span><span class="split__tag split__tag--b">After</span></div>`),
        tl: (el, card) => {
          const sp = $('.split', el), st = { x: 85 };
          const set = () => sp.style.setProperty('--x', st.x + '%');
          if (matchMedia('(pointer: fine)').matches) {
            sp.addEventListener('pointermove', (e) => { const r = sp.getBoundingClientRect(); gsap.to(st, { x: Math.min(98, Math.max(2, (e.clientX - r.left) / r.width * 100)), duration: .35, ease: 'power3.out', onUpdate: set, overwrite: true }); });
          }
          return gsap.timeline({ paused: true }).to(st, { x: 15, duration: 1.2, ease: 'expo.inOut', onUpdate: set }).to(st, { x: 50, duration: .8, ease: 'expo.inOut', onUpdate: set });
        },
      },
      loop: {
        html: () => stage(`<div class="layer s0">${page('old')}</div><div class="layer s1">${page('brut')}</div><div class="layer s2">${page('soft')}</div><div class="layer s3">${page('fin')}</div>`),
        tl: (el) => {
          const L = ['.s1', '.s2', '.s3'].map((s) => $(s, el));
          gsap.set(L, { clipPath: 'inset(0% 0% 100% 0%)' });
          const tl = gsap.timeline({ paused: true });
          L.forEach((l, i) => tl.to(l, { clipPath: 'inset(0% 0% 0% 0%)', duration: .45, ease: 'expo.inOut' }, i * .6));
          return tl;
        },
      },
      // Custom front-end
      code: {
        html: () => stage(`<pre class="code"><span class="ln"><span class="k">const</span> card = $(<span class="s">".card"</span>)</span><span class="ln">gsap.to(card, { y: <span class="v">-24</span> })</span><span class="ln">gsap.to(card, { rotate: <span class="v">6</span> })</span><span class="ln">gsap.to(card, { scale: <span class="v">1.12</span> })</span><span class="ln">card.style.bg = <span class="s">"pink"</span></span></pre>
          <div class="comp"><img src="${IMG}concept-common-table-cover.webp" alt=""><b></b><b></b><span class="comp-sel"></span></div>`),
        tl: (el) => {
          const ln = $$('.ln', el), comp = $('.comp', el), sel = $('.comp-sel', el);
          const tl = gsap.timeline({ paused: true });
          const run = (i, at) => tl.add(() => ln.forEach((l, k) => l.classList.toggle('is-run', k === i)), at);
          run(0, 0); tl.to(sel, { opacity: 1, duration: .25 }, 0);
          run(1, .5); tl.to(comp, { y: '-6cqw', duration: .5, ease: 'back.out(2)' }, .5);
          run(2, 1.0); tl.to(comp, { rotation: 6, duration: .5, ease: 'back.out(2)' }, 1.0);
          run(3, 1.5); tl.to(comp, { scale: 1.12, duration: .5, ease: 'back.out(2)' }, 1.5);
          run(4, 2.0); tl.to(comp, { backgroundColor: '#EA4F6E', duration: .4 }, 2.0).to(sel, { opacity: 0, duration: .3 }, 2.2);
          tl.add(() => {}, 2.6);
          tl.eventCallback('onReverseComplete', () => ln.forEach((l) => l.classList.remove('is-run')));
          return tl;
        },
      },
      live: {
        html: () => stage(`<pre class="code" style="width:50%"><span class="ln">.card {</span><span class="ln">  radius: <span class="v" data-o="r">8</span>px;</span><span class="ln">  rotate: <span class="v" data-o="a">0</span>deg;</span><span class="ln">  scale:  <span class="v" data-o="s">1.00</span>;</span><span class="ln">}</span></pre>
          <div class="comp" style="border-radius:8px"><img src="${IMG}concept-pixel-pull-cover.webp" alt=""><b></b><b></b></div><span class="knobs">Move the cursor ↔ ↕</span>`),
        tl: (el) => {
          const comp = $('.comp', el), o = { r: 8, a: 0, s: 1 };
          const draw = () => { gsap.set(comp, { borderRadius: o.r, rotation: o.a, scale: o.s }); $('[data-o="r"]', el).textContent = Math.round(o.r); $('[data-o="a"]', el).textContent = Math.round(o.a); $('[data-o="s"]', el).textContent = o.s.toFixed(2); };
          if (matchMedia('(pointer: fine)').matches) {
            el.addEventListener('pointermove', (e) => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; gsap.to(o, { r: x * 60, a: (y - .5) * 30, s: .85 + x * .35, duration: .4, ease: 'power3.out', onUpdate: draw, overwrite: true }); });
            el.addEventListener('pointerleave', () => gsap.to(o, { r: 8, a: 0, s: 1, duration: .6, ease: 'expo.out', onUpdate: draw, overwrite: true }));
          }
          return gsap.timeline({ paused: true }).to(o, { r: 48, a: -10, s: 1.15, duration: 1, ease: 'expo.inOut', onUpdate: draw }).to(o, { r: 20, a: 8, s: .95, duration: 1, ease: 'expo.inOut', onUpdate: draw });
        },
      },
      outline: {
        html: () => stage(`${page('fin')}`),
        tl: (el) => {
          const view = $('.view', el), labels = { logo: 'a.logo', nav: 'nav · 3 links', h: 'h1 · 64px', txt: 'p.lead', btn: 'button.cta', img: 'img · 4:5' };
          const ols = KEYS.map((k) => { const t = $(`[data-k="${k}"]`, el); const d = document.createElement('div'); d.className = 'ol'; d.innerHTML = `<span>${labels[k]}</span>`; ['left', 'top', 'width', 'height', 'right'].forEach((p) => d.style[p] = getComputedStyle(t)[p]); d.style.right = 'auto'; view.append(d); return d; });
          const place = () => KEYS.forEach((k, i) => { const t = $(`[data-k="${k}"]`, el); Object.assign(ols[i].style, { left: t.offsetLeft + 'px', top: t.offsetTop + 'px', width: t.offsetWidth + 'px', height: t.offsetHeight + 'px' }); });
          place(); addEventListener('resize', place);
          return gsap.timeline({ paused: true }).fromTo(ols, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: .35, stagger: .12, ease: 'back.out(2)' });
        },
      },
      // Ongoing improvements
      dial: {
        html: () => stage(`<div class="dial"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="arc" cx="50" cy="50" r="42"/></svg><b>54</b><small>Performance</small></div>
          <ul class="log"><li><i>+</i>New menu page</li><li><i>↑</i>Faster images</li><li><i>✓</i>Mobile nav fix</li><li><i>+</i>Booking widget</li></ul><span class="eg">Example only</span>`),
        tl: (el) => {
          const arc = $('.arc', el), C = 2 * Math.PI * 42, num = $('.dial b', el), o = { v: 54 };
          gsap.set(arc, { strokeDasharray: C, strokeDashoffset: C * (1 - .54) });
          return gsap.timeline({ paused: true })
            .to(o, { v: 98, duration: 1.6, ease: 'power2.out', onUpdate: () => { num.textContent = Math.round(o.v); arc.style.strokeDashoffset = C * (1 - o.v / 100); arc.style.stroke = gsap.utils.interpolate('#E58A3A', '#2E9E6B', (o.v - 54) / 44); } }, 0)
            .to($$('.log li', el), { opacity: 1, x: 0, duration: .4, stagger: .3, ease: 'power3.out' }, .2);
        },
      },
      versions: {
        html: () => stage(`<div class="ver v0" style="left:6%;top:8%">${page('wire')}<span class="ver__tag">v1.0</span></div><div class="ver v1" style="left:13%;top:15%">${page('soft')}<span class="ver__tag">v1.1</span></div><div class="ver v2" style="left:20%;top:22%">${page('fin')}<span class="ver__tag">v1.2</span></div>`),
        tl: (el) => {
          gsap.set($('.v0 .mp-bg', el), { background: '#FBEBDD' });
          return gsap.timeline({ paused: true })
            .fromTo($('.v1', el), { xPercent: 120, rotation: 8 }, { xPercent: 0, rotation: 0, duration: .7, ease: 'expo.out', immediateRender: true }, .1)
            .fromTo($('.v2', el), { xPercent: 120, rotation: 8 }, { xPercent: 0, rotation: 0, duration: .7, ease: 'expo.out', immediateRender: true }, .6);
        },
      },
      bugs: {
        html: () => stage(`${page('fin')}<span class="tick" style="left:56%;top:26%">✓</span><span class="tick" style="left:36%;top:73%">✓</span><span class="tick" style="left:58%;top:60%">✓</span><span class="tick" style="left:42%;top:7%">✓</span>`),
        tl: (el) => {
          const h = $('[data-k="h"]', el), btn = $('[data-k="btn"]', el), img = $('[data-k="img"]', el), nav = $('[data-k="nav"]', el), ticks = $$('.tick', el);
          const broken = document.createElement('div'); broken.className = 'broken'; broken.textContent = '⚠ image.jpg'; img.append(broken);
          gsap.set(h, { height: '14%', overflow: 'hidden', alignItems: 'flex-start' });
          gsap.set(btn, { x: '9cqw', y: '3cqw', rotation: -7 });
          gsap.set(nav, { x: '-22cqw' });
          return gsap.timeline({ paused: true })
            .to(h, { height: '30%', duration: .5, ease: 'back.out(1.6)' }, 0).to(ticks[0], { scale: 1, duration: .35, ease: 'back.out(3)' }, .3)
            .to(btn, { x: 0, y: 0, rotation: 0, duration: .5, ease: 'back.out(1.6)' }, .45).to(ticks[1], { scale: 1, duration: .35, ease: 'back.out(3)' }, .75)
            .to(broken, { opacity: 0, duration: .35 }, .9).to(ticks[2], { scale: 1, duration: .35, ease: 'back.out(3)' }, 1.1)
            .to(nav, { x: 0, duration: .5, ease: 'back.out(1.6)' }, 1.3).to(ticks[3], { scale: 1, duration: .35, ease: 'back.out(3)' }, 1.6)
            .to(ticks, { scale: 0, duration: .3, stagger: .05 }, 2.4);
        },
      },
    };

    const ROWS = [
      { n: '01', name: 'New website', desc: 'From first sketch to a launched site, for businesses that need a proper online presence.',
        opts: [['wire', 'Wireframe to finished'], ['type', 'Typed from a blank page'], ['sketch', 'Sketch to screen']] },
      { n: '02', name: 'Redesign', desc: 'For businesses that have outgrown their site: clearer navigation, better content, consistent on every screen.',
        opts: [['swap', 'Before → after, piece by piece'], ['slider', 'Before / after slider'], ['loop', 'Restyle loop']] },
      { n: '03', name: 'Custom front-end', desc: 'When a template won’t do: hand-coded pages, motion and interactive components.',
        opts: [['code', 'Code runs the component'], ['live', 'Live code ↔ preview'], ['outline', 'Dev-tools outlines']] },
      { n: '04', name: 'Ongoing improvements', desc: 'For a site you already have: new pages, layout and content updates, performance and new features.',
        opts: [['dial', 'Score climbs + changelog'], ['versions', 'Version stack'], ['bugs', 'Bugs snap into place']] },
    ];

    $('#rows').innerHTML = ROWS.map((r) => `<section class="svc"><div class="svc__head"><h2>${r.name}</h2><span class="mono muted">${r.n} / 04</span></div><div class="row">${
      r.opts.map(([key, label], i) => `<div class="opt"><div class="opt__label mono"><span>Option ${i + 1} · ${label}</span>${i === 0 ? '<span class="pick">My pick</span>' : ''}</div>
        <article class="card" data-scene="${key}"><span class="card__n mono">${r.n}</span><span class="hint mono">Hover</span>${SCENES[key].html()}<div><h3>${r.name}</h3><p>${r.desc}</p></div></article></div>`).join('')}</div></section>`).join('');

    if (!window.gsap) return;
    const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
    $$('.card').forEach((card) => {
      const tl = SCENES[card.dataset.scene].tl(card, card);
      // Render the start state (sets at time 0 don't draw while paused), then rewind.
      tl.progress(1).progress(0);
      $$('.is-run', card).forEach((l) => l.classList.remove('is-run'));
      if (REDUCE) { tl.progress(1); return; }
      const on = () => { card.classList.add('is-on'); tl.timeScale(1).play(); };
      const off = () => { card.classList.remove('is-on'); tl.timeScale(1.8).reverse(); };
      if (fine) { card.addEventListener('pointerenter', on); card.addEventListener('pointerleave', off); }
      else ScrollTrigger.create({ trigger: card, start: 'top 60%', end: 'bottom 40%', onToggle: (s) => (s.isActive ? on() : off()) });
      card.tabIndex = 0; card.addEventListener('focus', on); card.addEventListener('blur', off);
    });
    // Images inside stages load late; re-place outlines once they do.
    addEventListener('load', () => dispatchEvent(new Event('resize')));
  });
  </script>
</body>
</html>
