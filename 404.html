<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Noah Zaw Min Htut</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>var d=document.documentElement;d.dataset.theme='dark';try{d.dataset.theme=localStorage.getItem('noah-theme')||'dark'}catch(e){}</script>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    /* 404: the same type and square, one way home. Absolute paths: served at any depth. */
    body { font-family: 'Archivo', system-ui, sans-serif; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
    .mono { font-family: 'Geist Mono', monospace; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
    header, footer { display: flex; justify-content: space-between; align-items: center; padding: 1.4rem var(--gutter); }
    .logo { font-weight: 600; font-size: 1.625rem; letter-spacing: -.045em; text-decoration: none; }
    .skip { position: fixed; left: var(--gutter); top: .6rem; padding: .7rem 1rem; border-radius: 99px; background: var(--ink); color: var(--bg); text-decoration: none; translate: 0 -200%; transition: translate .4s var(--ease); }
    .skip:focus { translate: 0 0; }
    .logo { padding: .45rem .8rem; margin-left: -.8rem; border-radius: 99px; transition: background-color .3s; }
    .logo:hover { background: var(--bg-2); }
    .logo:hover i { scale: 1.6; }
    .logo:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    .logo i { transition: scale .5s cubic-bezier(.34,1.56,.64,1); transform-origin: 50% 100%; display: inline-block; width: .15em; height: .15em; margin-left: .105em; background: var(--mark); }
    main { display: grid; align-content: center; gap: 2rem; padding: 0 var(--gutter); }
    h1 { margin: 0; font-weight: 800; font-size: clamp(6rem, 30vw, 28rem); line-height: .8; letter-spacing: -.02em; display: flex; align-items: flex-end; }
    @view-transition { navigation: auto; }
    h1 i { view-transition-name: dot; width: .2em; height: .2em; margin: 0 0 .05em .05em; background: var(--mark); flex: none; }
    p { margin: 0; max-width: 30rem; font-size: clamp(1.2rem, 2vw, 1.6rem); line-height: 1.25; }
    .home { justify-self: start; display: inline-flex; align-items: center; gap: .6rem; padding: 1.1rem 1.5rem; border-radius: 99px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; }
    .home b { display: grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--pink); color: var(--on-pink); transition: rotate .5s var(--ease); }
    .home { position: relative; overflow: hidden; isolation: isolate; transition: color .4s; }
    .home::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--pink); translate: 0 101%; transition: translate .6s var(--ease); }
    .home:hover, .home:focus-visible { color: var(--on-pink); }
    .home:hover::before, .home:focus-visible::before { translate: 0 0; }
    .home:hover b, .home:focus-visible b { rotate: -45deg; background: var(--ink); color: var(--bg); }
    .home:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      h1, p, .home { animation: rise 1s var(--ease) both; } p { animation-delay: .1s; } .home { animation-delay: .2s; }
      @keyframes rise { from { opacity: 0; translate: 0 30px; } }
    }
  </style>
</head>
<body>
  <a class="skip mono" href="#main">Skip to content</a>
  <header><a class="logo" href="/">noah<i></i></a><span class="mono">Singapore → Worldwide</span></header>
  <main id="main">
    <h1 aria-label="404">404<i aria-hidden="true"></i></h1>
    <p>This page isn't here. It may have moved, or the link was mistyped.</p>
    <a class="home" href="/">Back to the homepage <b aria-hidden="true">→</b></a>
  </main>
  <footer class="mono"><span>© 2026 Noah Zaw Min Htut</span><span>Page not found</span></footer>
</body>
</html>
